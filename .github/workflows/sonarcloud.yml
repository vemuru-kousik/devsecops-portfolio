name: SonarCloud Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=vemuru-kousik
            -Dsonar.projectKey=vemuru-kousik_devsecops-portfolio
            -Dsonar.sources=juice-shop-source
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'juice-shop'
          path: 'juice-shop-source'
          format: 'HTML'
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
  
    # =========================
  # OWASP ZAP DAST
  # =========================
  zap-dast:
    runs-on: ubuntu-latest

    steps:
      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop

      - name: Wait for Juice Shop
        run: |
          echo "Waiting for Juice Shop..."
          sleep 30

      - name: Check Juice Shop
        run: |
          curl -I http://localhost:3000

      - name: Prepare ZAP report directory
        run: |
          mkdir -p zap-work
          chmod 777 zap-work

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-work:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -r zap-report.html \
            -I

      - name: Copy ZAP Report
        run: |
          cp zap-work/zap-report.html ./zap-report.html

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html