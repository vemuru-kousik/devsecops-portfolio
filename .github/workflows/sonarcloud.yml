name: SonarCloud Scan
on:
	push:
		branches: [ main ]
	pull_requests:
		branches: [ main ]

jobs:
	sonarcloud:
		runs-on: ubuntu-latest
		steps:
			- uses: actions/checkout@v4
			  with:
				fetch-depth: 0
			- name: SonarCloud Scan
			  Uses: SonarSource/sonarcloud-github-action@master
			  env:
				GITHUB-TOKEN: ${{ secrets.GITHUB_TOKEN }}
				SONAR_TOEK: ${{ secrets.SONAR_TOKEN }}
			  with:
				args: >
					-Dsonar.organization= vemuru-kousik
					-Dsonar.projectKey= vemuru-kousik_devsecops_portfolio
					-Dsonar.sources=juice-shop-source