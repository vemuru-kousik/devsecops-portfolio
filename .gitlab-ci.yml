sonarcloud-check:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]

  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"

  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache

  script:
    - sonar-scanner
      -Dsonar.organization=vemuru-kousik
      -Dsonar.projectKey=vemuru-kousik_devsecops-portfolio
      -Dsonar.sources=juice-shop

  only:
    - main
